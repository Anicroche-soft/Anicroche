<!DOCTYPE html>

<html>
    <head>
        <title>AVEC</title>

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- JavaScript actif : les pages suivantes ne seront plus construites par le serveur,
             et le contenu qu'il a construit pour celle-ci est masqué avant tout affichage -->
        <script>
            document.cookie = 'avec-js=1; Path=/; Max-Age=31536000; SameSite=Lax'
            document.documentElement.classList.add('avec-js')
        </script>
        <style>
            .avec-js body[data-pre-rendu] > * {
                display: none;
            }
        </style>

        <link rel="icon" type="image/svg+xml" href="/systeme/images/favicon.svg" />
        <link rel="shortcut icon" href="/systeme/images/favicon.ico" />

        <link rel="manifest" href="/systeme/app.webmanifest" />
        <link rel="canonical" href="/" />
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

        <script type="module" src="/systeme/scripts/architecte.js"></script>

        <style>
            * {
                margin: 0;
                padding: 0;
                gap: 1rem;
                box-sizing: border-box;

                background: none;
                border: none;
                font-weight: normal;
                text-decoration: none;
            }

            body,    header,   main, footer,
            section, article,  nav,  aside,
            figure,  legend,   div,
            form,    fieldset, label {
                display: flex;
                flex-flow: column nowrap;
            }
        </style>
    </head>

    <body id="avec"></body>
</html>
